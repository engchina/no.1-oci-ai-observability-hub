[package]
name = "no1-oci-ai-observability-hub"
version = "0.1.0"
description = "Desktop observability hub for OCI Generative AI on-demand usage and costs"
authors = ["engchina"]
edition = "2021"

[lib]
name = "no1_oci_ai_observability_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "no1-oci-ai-observability-hub"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["image-png"] }
url = "2"
