#cloud-config
output: {all: '| tee -a /var/log/cloud-init-langfuse.log'}
package_update: true
package_upgrade: false
packages:
  - ca-certificates
  - curl
  - git
  - gnupg
  - jq
  - openssl
  - iptables-persistent
bootcmd:
  - mkdir -p ${app_home}
write_files:
  - path: "${app_home}/config.env"
    permissions: "0600"
    encoding: "gzip+base64"
    content: |
      ${langfuse_config}
runcmd:
  - echo "Downloading no.1-oci-ai-observability-hub from GitHub main..."
  - bash -lc 'rm -rf "${app_source_dir}"'
  - bash -lc 'git clone --depth 1 --branch "${app_git_ref}" "${app_repo_url}" "${app_source_dir}"'
  - bash -lc 'chmod +x "${app_source_dir}/init_script.sh"'
  - echo "Running Langfuse init script..."
  - bash -lc 'APP_HOME="${app_home}" CONFIG_FILE="${app_home}/config.env" nohup bash "${app_source_dir}/init_script.sh" >> /var/log/cloud-init-langfuse.log 2>&1 &'
