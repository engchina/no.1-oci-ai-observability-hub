title: "Deploy Langfuse on Oracle Cloud Infrastructure Compute"
stackDescription: "Creates an OCI Compute instance and deploys Langfuse v3 with Docker Compose."
schemaVersion: 1.1.0
version: "20260602"
locale: "en"

variableGroups:
  - title: Hidden
    visible: false
    variables:
      - ubuntu_os_version
      - langfuse_init_org_id
      - langfuse_init_org_name
      - langfuse_admin_name

  - title: Required Configuration
    visible: true
    variables:
      - region
      - compartment_ocid
      - availability_domain
      - ssh_authorized_keys

  - title: Compute Configuration
    visible: true
    variables:
      - instance_display_name
      - instance_shape
      - instance_flex_shape_ocpus
      - instance_flex_shape_memory
      - instance_boot_volume_size
      - instance_boot_volume_vpus
      - instance_image_ocid

  - title: Network Configuration
    visible: true
    variables:
      - existing_vcn_id
      - existing_subnet_id

  - title: Pinned Container Versions
    visible: false
    variables:
      - langfuse_version
      - clickhouse_version
      - minio_image
      - redis_version
      - postgres_version

  - title: Langfuse Initial Login
    visible: true
    variables:
      - langfuse_admin_email
      - langfuse_admin_password

variables:
  region:
    title: Region
    type: oci:identity:region:name
    required: true
    visible: false

  compartment_ocid:
    type: oci:identity:compartment:id
    required: true
    visible: true
    title: "Create in compartment"

  availability_domain:
    type: oci:identity:availabilitydomain:name
    required: true
    visible: true
    title: "Availability domain"
    default: "bxtG:AP-TOKYO-1-AD-1"
    dependsOn:
      region: ${region}
      compartmentId: ${compartment_ocid}

  ssh_authorized_keys:
    type: oci:core:ssh:publickey
    title: "SSH public key"
    description: "Public key installed for the ubuntu user."
    required: true
    visible: true

  instance_display_name:
    type: string
    required: true
    visible: true
    title: "Compute instance name"
    default: "no1-langfuse"

  instance_shape:
    type: enum
    required: true
    visible: true
    title: "Compute shape"
    enum:
      - "VM.Standard.E4.Flex"
      - "VM.Standard.E5.Flex"
    default: "VM.Standard.E4.Flex"

  instance_flex_shape_ocpus:
    type: number
    required: true
    visible: true
    title: "OCPUs"
    default: 2
    minimum: 2

  instance_flex_shape_memory:
    type: number
    required: true
    visible: true
    title: "Memory in GiB"
    default: 16
    minimum: 8

  instance_boot_volume_size:
    type: number
    required: true
    visible: true
    title: "Boot volume size in GiB"
    default: 100
    minimum: 100

  instance_boot_volume_vpus:
    type: number
    required: true
    visible: true
    title: "Boot volume VPUs per GiB"
    default: 10

  instance_image_ocid:
    type: string
    required: false
    visible: true
    title: "Custom image OCID"
    description: "Leave empty to use the latest Canonical Ubuntu 22.04 image for the selected shape."
    default: ""

  ubuntu_os_version:
    type: string
    required: false
    visible: false
    default: "22.04"

  existing_vcn_id:
    type: oci:core:vcn:id
    required: true
    title: "Existing VCN"
    description: "Select the preconfigured VCN that contains the public subnet."
    dependsOn:
      compartmentId: ${compartment_ocid}
    visible: true

  existing_subnet_id:
    type: oci:core:subnet:id
    required: true
    title: "Existing public subnet"
    description: "Select the preconfigured public subnet for the Langfuse compute instance."
    dependsOn:
      compartmentId: ${compartment_ocid}
      vcnId: ${existing_vcn_id}
      hidePrivateSubnet: true
    visible: true

  langfuse_version:
    type: string
    required: true
    visible: false
    title: "Langfuse version"
    description: "Pinned Langfuse release. The stack checks out v<version> and pins Langfuse web/worker images to this exact version."
    default: "3.176.0"
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"

  clickhouse_version:
    type: string
    required: true
    visible: false
    title: "ClickHouse image tag"
    default: "25.8"

  minio_image:
    type: string
    required: true
    visible: false
    title: "MinIO image reference"
    description: "Pinned by digest to keep Langfuse's official Chainguard MinIO behavior stable."
    default: "cgr.dev/chainguard/minio@sha256:6357b3cbf5a16136bae0fbbf94406fef4de924f69b9632b0aaa5f788338ae6ad"

  redis_version:
    type: string
    required: true
    visible: false
    title: "Redis image tag"
    default: "7.4"

  postgres_version:
    type: string
    required: true
    visible: false
    title: "Postgres image tag"
    default: "17.10"

  langfuse_init_org_id:
    type: string
    required: true
    visible: false
    title: "Initial organization ID"
    description: "Required for creating the initial login user via Langfuse headless initialization."
    default: "no1-observability"

  langfuse_init_org_name:
    type: string
    required: true
    visible: false
    title: "Initial organization name"
    default: "No.1 OCI AI Observability Hub"

  langfuse_admin_email:
    type: string
    required: true
    visible: true
    title: "Initial login email"
    description: "Use this email as the Langfuse username."
    pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"

  langfuse_admin_name:
    type: string
    required: true
    visible: false
    title: "Initial login display name"
    default: "Langfuse Admin"

  langfuse_admin_password:
    type: password
    confirmation: true
    required: true
    visible: true
    title: "Initial login password"
    description: "12-128 chars. Allowed: letters, numbers, and . _ @ % + = : , / ! ~ -."
    pattern: "^[A-Za-z0-9._@%+=:,/!~-]{12,128}$"

outputs:
  instance_public_ip:
    title: "Instance Public IP"
    displayText: "Instance Public IP"
    type: copyableString
    visible: true

  ssh_to_instance:
    title: "SSH command"
    displayText: "SSH command"
    type: copyableString
    visible: true

  langfuse_url:
    title: "Langfuse URL"
    displayText: "Langfuse URL"
    type: link
    visible: true

  minio_public_endpoint:
    title: "MinIO Public Endpoint"
    displayText: "MinIO Public Endpoint"
    type: link
    visible: true

  cloud_init_log:
    title: "Setup log command"
    displayText: "Setup log command"
    type: copyableString
    visible: true
